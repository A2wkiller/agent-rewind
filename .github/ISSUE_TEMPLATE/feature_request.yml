name: Feature request
description: Suggest an idea for TraceGate
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or pain point
      placeholder: "When my AI coding session does X, I wish TraceGate would..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "Backtracking / rewind"
        - "Cost estimates / budgets"
        - "Support for another AI tool"
        - "Installer"
        - "Docs"
