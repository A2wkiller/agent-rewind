name: Bug report
description: Report a bug in TraceGate
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: "e.g. commit 2085890"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected part
      options:
        - "tracegate.py (start / log / cost / end / report)"
        - "checkpoint or rewind (git snapshots)"
        - "install.py"
        - "SKILL.md (the AI's instructions)"
        - "pricing.json"
        - "docs"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python3 tracegate.py start ...`
        2. Run `python3 tracegate.py rewind ...`
        3. See error...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      description: Paste the relevant output. Remove anything private first.
      render: shell
