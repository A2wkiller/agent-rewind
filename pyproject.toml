[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "tracegate"
version = "1.0.0"
description = "AI Execution Proxy, Pre-Flight Token/Cost Firewall, GitHub Skill Router & Counterfactual DAG Backtracker"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
   { name = "Vaibhav Jain" }
]
keywords = ["mcp", "llm", "token-firewall", "dag", "backtracking", "ai-proxy", "fastapi"]
dependencies = [
   "fastmcp>=2.0.0",
   "fastapi>=0.115.0",
   "uvicorn[standard]>=0.32.0",
   "websockets>=13.0",
   "httpx>=0.27.0",
   "tiktoken>=0.8.0",
   "pyyaml>=6.0.2",
   "anthropic>=0.40.0",
   "google-genai>=1.0.0",
   "openai>=1.55.0",
]
[project.optional-dependencies]
dev = [
   "pytest>=8.3.0",
   "pytest-asyncio>=0.24.0",
]
[project.scripts]
tracegate = "tracegate_cli:main"
tracegate-mcp = "tracegate_mcp:mcp.run"
[tool.hatch.build.targets.wheel]
include = [
   "tracegate_mcp.py",
   "tracegate_bridge.py",
   "tracegate_cli.py",
   "index.html",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test_tracegate_agentic_loop.py", "tests"]
